<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sojourn — Your Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#FAF8F5; --bg-warm:#F3EFE8; --bg-card:#FFFFFF;
  --ink:#1A1A2E; --ink-mid:#4A4A5A; --ink-light:#8A8A9A;
  --brand:#2C5F8C; --brand-dark:#1A3D5C;
  --accent:#C8A96A; --accent-lt:#F7F0E3;
  --rule:#E2DDD6; --radius:8px; --radius-lg:14px;
  --cat-dining:#E07A5F; --cat-stays:#2C5F8C;
  --cat-exp:#6B7A8D; --cat-social:#C8A96A; --cat-wellness:#81B29A;
  --tab-h:64px; --nav-h:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}

/* ── NAV ── */
.top-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(250,248,245,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;z-index:200;}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;}
.nav-logo sup{font-size:0.4em;vertical-align:super;opacity:0.5;font-weight:400;}
.back-btn{display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;font-weight:400;color:var(--brand);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;padding:0.4rem 0;}
.back-btn svg{width:16px;height:16px;}
.city-badge{font-size:0.78rem;font-weight:500;color:var(--ink-mid);letter-spacing:0.04em;}

/* ── MAIN SCROLL ── */
.main{position:fixed;top:var(--nav-h);left:0;right:0;bottom:var(--tab-h);overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .view{display:none;min-height:100%;}
  .view.active{display:block;}
  #plan-view.active, #itinerary-view.active { padding: 1.25rem; }
  #map-view.active{display:block;position:absolute;top:0;left:0;right:0;bottom:0;}
  #map-view{padding:0;position:relative;}
  #leaflet-map{position:absolute;top:0;left:0;right:0;bottom:0;}

/* ── BUDGET HEADER ── */
.budget-header{background:var(--brand);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;}
.budget-total{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:white;}
.budget-label{font-size:0.72rem;font-weight:500;color:rgba(255,255,255,0.6);letter-spacing:0.1em;text-transform:uppercase;}
.budget-city{font-size:0.9rem;color:rgba(255,255,255,0.9);font-weight:300;}

/* ── CATEGORY CARDS ── */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}
.cat-card{border-radius:var(--radius-lg);padding:1.25rem;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;}
.cat-card:active{transform:scale(0.97);}
.cat-card-inner{position:relative;z-index:1;}
.cat-emoji{font-size:1.6rem;margin-bottom:0.5rem;display:block;}
.cat-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500;color:white;line-height:1.2;}
.cat-budget{font-size:0.78rem;color:rgba(255,255,255,0.8);margin-top:0.25rem;}
.cat-pct{font-size:0.72rem;color:rgba(255,255,255,0.6);letter-spacing:0.06em;}
.cat-arrow{position:absolute;bottom:1rem;right:1rem;width:28px;height:28px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cat-dining{background:linear-gradient(135deg,#E07A5F,#c5614a);}
.cat-stays{background:linear-gradient(135deg,#2C5F8C,#1a3d5c);}
.cat-exp{background:linear-gradient(135deg,#6B7A8D,#4a5a6d);}
.cat-social{background:linear-gradient(135deg,#C8A96A,#a88848);}
.cat-wellness{background:linear-gradient(135deg,#81B29A,#5d9178);}

/* ── SUBCATEGORY ── */
.section-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--ink);margin-bottom:0.25rem;}
.section-sub{font-size:0.85rem;color:var(--ink-mid);font-weight:300;margin-bottom:1.25rem;}
.subcat-list{display:flex;flex-direction:column;gap:0.6rem;}
.subcat-item{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color 0.2s,transform 0.15s;}
.subcat-item:active{transform:scale(0.98);}
.subcat-item:hover{border-color:var(--brand);}
.subcat-left{display:flex;align-items:center;gap:0.75rem;}
.subcat-emoji{font-size:1.3rem;}
.subcat-name{font-size:0.95rem;font-weight:500;color:var(--ink);}
.subcat-count{font-size:0.78rem;color:var(--ink-light);}
.subcat-chevron{color:var(--ink-light);font-size:1.1rem;}
.budget-pill{background:var(--accent-lt);border:1px solid rgba(200,169,106,0.3);border-radius:100px;padding:0.2rem 0.6rem;font-size:0.72rem;font-weight:500;color:var(--accent);}

/* ── PLACE CARDS ── */
.places-list{display:flex;flex-direction:column;gap:0.75rem;}
.place-card{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:transform 0.15s,box-shadow 0.2s;}
.place-card:active{transform:scale(0.98);}
.place-card:hover{box-shadow:0 4px 20px rgba(26,26,46,0.08);border-color:rgba(44,95,140,0.3);}
.place-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:600;color:white;flex-shrink:0;}
.place-body{padding:1rem 1.25rem;}
.place-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.5rem;}
.place-name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:500;color:var(--ink);line-height:1.2;}
.place-rating{display:flex;align-items:center;gap:0.25rem;font-size:0.82rem;font-weight:500;color:var(--accent);}
.place-desc{font-size:0.85rem;font-weight:300;color:var(--ink-mid);line-height:1.6;margin-bottom:0.75rem;}
.place-footer{display:flex;align-items:center;justify-content:space-between;}
.place-price{font-size:0.78rem;color:var(--ink-light);}
.place-tags{display:flex;gap:0.4rem;flex-wrap:wrap;}
.tag{background:var(--bg-warm);border-radius:100px;padding:0.2rem 0.6rem;font-size:0.7rem;color:var(--ink-mid);}
.add-btn{background:var(--brand);color:white;border:none;border-radius:100px;padding:0.4rem 0.9rem;font-size:0.78rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.2s;}
.add-btn:hover{background:var(--brand-dark);}
.add-btn.added{background:var(--cat-wellness);}

/* ── MAP TAB ── */
#map-view{padding:0;position:relative;}
#leaflet-map{position:absolute;top:0;left:0;right:0;bottom:0;}
.map-legend{position:absolute;top:0.75rem;right:0.75rem;background:rgba(250,248,245,0.95);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:0.75rem 1rem;z-index:400;}
.legend-item{display:flex;align-items:center;gap:0.5rem;font-size:0.72rem;color:var(--ink-mid);margin-bottom:0.3rem;}
.legend-item:last-child{margin-bottom:0;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.map-place-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.25rem;z-index:400;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);border-top:1px solid var(--rule);}
.map-place-sheet.visible{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--rule);border-radius:2px;margin:0 auto 1rem;}
.sheet-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;color:var(--ink-light);cursor:pointer;}

/* ── ITINERARY TAB ── */
.itinerary-empty{text-align:center;padding:3rem 1.5rem;}
.itinerary-empty-icon{font-size:3rem;margin-bottom:1rem;opacity:0.4;}
.itinerary-empty-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--ink);margin-bottom:0.5rem;}
.itinerary-empty-sub{font-size:0.85rem;color:var(--ink-light);line-height:1.6;}
.day-section{margin-bottom:1.5rem;}
.day-header{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:500;color:var(--ink);margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;}
.day-label{font-size:0.72rem;font-weight:500;color:var(--ink-light);letter-spacing:0.08em;text-transform:uppercase;}
.itinerary-item{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:0.9rem 1.1rem;margin-bottom:0.5rem;display:flex;align-items:center;justify-content:space-between;}
.itinerary-item-left{display:flex;align-items:center;gap:0.75rem;}
.itinerary-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.itinerary-name{font-size:0.9rem;font-weight:500;color:var(--ink);}
.itinerary-sub{font-size:0.75rem;color:var(--ink-light);}
.remove-btn{background:none;border:none;color:var(--ink-light);font-size:1rem;cursor:pointer;padding:0.25rem;}
.clear-btn{background:none;border:1px solid var(--rule);border-radius:100px;padding:0.3rem 0.75rem;font-size:0.75rem;color:var(--ink-mid);cursor:pointer;font-family:'DM Sans',sans-serif;}

/* ── BOTTOM TABS ── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:rgba(250,248,245,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-around;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.25rem;cursor:pointer;border:none;background:none;padding:0.5rem;transition:opacity 0.2s;}
.tab-icon{font-size:1.3rem;line-height:1;}
.tab-label{font-size:0.65rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-light);transition:color 0.2s;}
.tab-btn.active .tab-label{color:var(--brand);}
.tab-btn.active .tab-icon{filter:drop-shadow(0 0 3px rgba(44,95,140,0.3));}

/* ── INPUT SCREEN ── */
.input-screen{position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;padding:2rem 1.5rem 3rem;}
.input-header{text-align:center;margin-bottom:2.5rem;padding-top:1rem;}
.input-logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);margin-bottom:0.25rem;}
.input-logo sup{font-size:0.35em;vertical-align:super;opacity:0.5;}
.input-tagline{font-size:0.85rem;color:var(--ink-mid);font-weight:300;}
.input-group{margin-bottom:1.25rem;}
.input-label{font-size:0.75rem;font-weight:500;color:var(--ink-mid);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.5rem;display:block;}
.input-field{width:100%;border:1.5px solid var(--rule);border-radius:var(--radius-lg);padding:0.85rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:300;color:var(--ink);background:var(--bg-card);outline:none;transition:border-color 0.2s;}
.input-field:focus{border-color:var(--brand);}
.city-suggestions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;}
.city-chip{background:var(--bg-warm);border:1px solid var(--rule);border-radius:100px;padding:0.35rem 0.85rem;font-size:0.82rem;color:var(--ink-mid);cursor:pointer;transition:all 0.2s;}
.city-chip:hover,.city-chip.selected{background:var(--brand);color:white;border-color:var(--brand);}
.slider-section{margin-bottom:1.5rem;}
.slider-section-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--ink);margin-bottom:1rem;}
.slider-row{margin-bottom:1rem;}
.slider-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.4rem;}
.slider-name{font-size:0.88rem;font-weight:500;color:var(--ink);}
.slider-vals{display:flex;align-items:baseline;gap:0.3rem;}
.slider-amt{font-size:0.88rem;font-weight:500;color:var(--brand);}
.slider-pct{font-size:0.75rem;color:var(--ink-light);}
.slider-track{position:relative;height:4px;background:var(--rule);border-radius:2px;}
.slider-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;transition:width 0.1s;}
.slider-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--bg-card);border:2px solid currentColor;border-radius:50%;pointer-events:none;transition:left 0.1s;}
.slider-input{position:absolute;top:-8px;left:0;right:0;width:100%;height:20px;opacity:0;cursor:pointer;margin:0;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-top:1px solid var(--rule);margin-top:0.5rem;}
.total-label{font-size:0.82rem;color:var(--ink-light);}
.total-val{font-size:0.9rem;font-weight:500;color:var(--green);}
.optimize-btn{width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:var(--radius-lg);padding:1rem;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s;margin-top:1rem;}
.optimize-btn:hover{background:var(--brand-dark);}
.cat-dining-color{color:var(--cat-dining);}
.cat-stays-color{color:var(--cat-stays);}
.cat-exp-color{color:var(--cat-exp);}
.cat-social-color{color:var(--cat-social);}
.cat-wellness-color{color:var(--cat-wellness);}
  /* NEW FEATURES */
  .time-banner{border-radius:var(--radius-lg);padding:0.65rem 1rem;margin-bottom:0.9rem;display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;}
  .time-morning{background:#FFF8E7;color:#8B6914;}
  .time-afternoon{background:#E8F5EE;color:#1E7A4E;}
  .time-evening{background:#FFF0EB;color:#c05a3a;}
  .time-night{background:#EBF0F8;color:var(--brand);}
  .surprise-bar{width:100%;background:linear-gradient(135deg,var(--accent),#a88030);color:white;border:none;border-radius:var(--radius-lg);padding:0.85rem;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.9rem;}
  .adj-panel{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius-lg);margin-bottom:0.9rem;overflow:hidden;}
  .adj-hdr{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;cursor:pointer;}
  .adj-hdr span{font-size:0.85rem;font-weight:500;color:var(--ink);}
  .adj-body{padding:0 1rem 0.9rem;display:none;}
  .adj-body.open{display:block;}
  .adj-row{margin-bottom:0.75rem;}
  .book-btn{background:var(--brand);color:white;border:none;border-radius:100px;padding:0.3rem 0.7rem;font-size:0.7rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-flex;align-items:center;transition:background 0.15s;}
  .book-btn:hover{background:var(--brand-dark);}
  .fav-btn{width:26px;height:26px;border:1px solid var(--rule);border-radius:50%;background:none;cursor:pointer;font-size:0.8rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
  .fav-btn.loved{background:#E07A5F;border-color:#E07A5F;color:white;}
  .dist-tag{font-size:0.68rem;color:var(--brand);font-weight:500;}
  .it-actions{display:flex;gap:0.6rem;margin-bottom:1rem;}
  .it-act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.65rem;border-radius:var(--radius-lg);font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:500;cursor:pointer;}
  .it-share{background:var(--brand);color:white;border:none;}
  .it-export{background:var(--bg-warm);color:var(--ink);border:1px solid var(--rule);}
  .bsummary{background:var(--brand);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-top:1rem;display:flex;justify-content:space-between;}
  .bsummary-item{text-align:center;}
  .bsummary-val{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;color:white;}
  .bsummary-lbl{font-size:0.62rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;}
  .toast-el{position:fixed;bottom:calc(var(--tab-h) + 0.75rem);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:0.5rem 1.1rem;border-radius:100px;font-size:0.8rem;opacity:0;transition:all 0.3s;z-index:700;white-space:nowrap;pointer-events:none;}
  .toast-el.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .surp-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.55);z-index:600;display:none;align-items:flex-end;}
  .surp-overlay.open{display:flex;}
  .surp-sheet{background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.25rem 1.25rem 2rem;width:100%;position:relative;animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .surp-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.1rem;color:var(--ink-light);cursor:pointer;}
  .surp-badge{display:inline-block;font-size:0.68rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-lt);border:1px solid rgba(200,169,106,0.3);padding:0.18rem 0.55rem;border-radius:100px;margin-bottom:0.65rem;}
  .surp-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--ink);margin-bottom:0.3rem;}
  .surp-rating{font-size:0.82rem;color:var(--accent);margin-bottom:0.65rem;}
  .surp-desc{font-size:0.84rem;color:var(--ink-mid);line-height:1.65;font-weight:300;margin-bottom:1rem;}
  .surp-acts{display:flex;gap:0.65rem;}
  .surp-book{flex:1;background:var(--brand);color:white;border:none;border-radius:var(--radius-lg);padding:0.8rem;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;}
  .surp-add{flex:1;background:var(--bg-warm);color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:0.8rem;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;}
  .srch-view{padding:1rem;}
  .srch-wrap{position:relative;margin-bottom:1rem;}
  .srch-field{width:100%;border:1.5px solid var(--rule);border-radius:var(--radius-lg);padding:0.8rem 1rem 0.8rem 2.4rem;font-family:'DM Sans',sans-serif;font-size:0.95rem;color:var(--ink);background:var(--bg-card);outline:none;transition:border-color 0.2s;}
  .srch-field:focus{border-color:var(--brand);}
  .srch-icon{position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);font-size:0.85rem;color:var(--ink-light);}
  .srch-result{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:0.85rem 1rem;margin-bottom:0.5rem;}
  .srch-result-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem;}
  .srch-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:500;color:var(--ink);}
  .srch-pill{font-size:0.65rem;font-weight:600;color:white;padding:0.15rem 0.5rem;border-radius:100px;}
  .srch-meta{font-size:0.76rem;color:var(--ink-mid);margin-bottom:0.3rem;}
  .srch-desc{font-size:0.78rem;color:var(--ink-light);font-weight:300;line-height:1.5;}
  .srch-empty{text-align:center;padding:2.5rem 1rem;color:var(--ink-light);}

// ── INPUT SCREEN SLIDERS ────────────────────────────────────────────────────
const siCats = ['dining','stays','experiences','social','wellness'];
let siVals = { dining:30, stays:20, experiences:20, social:15, wellness:15 };
let siPrev = {...siVals};

function siRender() {
  const budget = parseInt(document.getElementById('budget-input').value) || 0;
  siCats.forEach(c => {
    const v = Math.round(siVals[c]);
    document.getElementById('si-fill-'+c).style.width = v+'%';
    document.getElementById('si-thumb-'+c).style.left = v+'%';
    document.getElementById('si-sl-'+c).value = v;
    document.getElementById('si-amt-'+c).textContent = '$'+Math.round(budget*v/100).toLocaleString();
    document.getElementById('si-pct-'+c).textContent = v+'%';
  });
  const total = siCats.reduce((s,c)=>s+Math.round(siVals[c]),0);
  document.getElementById('si-total').textContent = '$'+Math.round(budget*total/100).toLocaleString()+' / $'+budget.toLocaleString();
}

function siRebalance(moved) {
  const newVal = parseInt(document.getElementById('si-sl-'+moved).value);
  const remaining = 100 - newVal;
  const others = siCats.filter(c=>c!==moved);
  const otherTotal = others.reduce((s,c)=>s+siVals[c],0);
  siVals[moved] = newVal;
  if(otherTotal > 0) {
    others.forEach(c=>{siVals[c]=Math.max(0,siVals[c]*remaining/otherTotal);});
    const diff = 100 - siCats.reduce((s,c)=>s+siVals[c],0);
    const adj = others.filter(c=>siVals[c]>0);
    if(adj.length) siVals[adj[0]] += diff;
  } else {
    others.forEach(c=>{siVals[c]=remaining/others.length;});
  }
  siPrev = {...siVals};
  siRender();
}

siCats.forEach(c=>{
  document.getElementById('si-sl-'+c).addEventListener('input',()=>siRebalance(c));
});
document.getElementById('budget-input').addEventListener('input',siRender);
siRender();

function selectCity(city) {
  document.getElementById('city-input').value = city;
  document.querySelectorAll('.city-chip').forEach(c=>{
    c.classList.toggle('selected', c.textContent === city.split(',')[0]);
  });
}

// ── GEOLOCATION ─────────────────────────────────────────────────────────────
function useMyLocation() {
  const btn = document.getElementById('location-btn');
  const btnText = document.getElementById('location-btn-text');

  if(!navigator.geolocation) {
    btnText.textContent = 'Location not supported on this device';
    return;
  }

  btnText.textContent = 'Finding your location...';
  btn.style.borderColor = 'var(--brand)';
  btn.style.color = 'var(--brand)';

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const { latitude, longitude } = position.coords;
      state.userLat = latitude;
      state.userLng = longitude;
      const nearest = findNearestCity(latitude, longitude);
      const select = document.getElementById('city-input');
      select.value = nearest.city;
      btnText.textContent = nearest.exact
        ? `📍 Location set to ${nearest.city.split(',')[0]}`
        : `Nearest city: ${nearest.city.split(',')[0]}`;
      btn.style.borderColor = 'var(--cat-wellness)';
      btn.style.color = 'var(--cat-wellness)';
    },
    (error) => {
      btnText.textContent = 'Could not get location — please select a city';
      btn.style.borderColor = 'var(--cat-dining)';
      btn.style.color = 'var(--cat-dining)';
      setTimeout(() => {
        btnText.textContent = 'Use my current location';
        btn.style.borderColor = 'var(--rule)';
        btn.style.color = 'var(--ink-mid)';
      }, 3000);
    },
    { timeout: 8000, maximumAge: 60000 }
  );
}

function findNearestCity(lat, lng) {
  const cityCoords = {
    'Chicago, IL':      { lat: 41.8827, lng: -87.6233 },
    'New York, NY':     { lat: 40.7580, lng: -73.9855 },
    'Lisbon, Portugal': { lat: 38.7169, lng: -9.1399  }
  };

  let nearest = null;
  let minDist = Infinity;

  Object.entries(cityCoords).forEach(([city, coords]) => {
    const dist = Math.sqrt(
      Math.pow(lat - coords.lat, 2) +
      Math.pow(lng - coords.lng, 2)
    );
    if(dist < minDist) {
      minDist = dist;
      nearest = city;
    }
  });

  // Consider "exact" if within ~100km
  const exact = minDist < 1.0;
  return { city: nearest, exact };
}

function buildPlan() {
  const cityInput = document.getElementById('city-input').value;
  const budget = parseInt(document.getElementById('budget-input').value) || 1500;

  state.city = cityInput;
  state.budget = budget;
  state.sliders = {...siVals};

  // Hide input screen, show app
  document.getElementById('input-screen').style.display = 'none';
  document.getElementById('top-nav').style.display = 'flex';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('tab-bar').style.display = 'flex';

  // Update display
  document.getElementById('nav-city').textContent = cityInput.split(',')[0];
  document.getElementById('disp-city').textContent = cityInput;
  document.getElementById('disp-duration').textContent = budget < 200 ? 'Night Out' : budget < 800 ? 'Weekend' : budget < 2000 ? 'Short Trip' : 'Full Trip';

  updateBudgetDisplay();

  // Update category cards
  const cats = ['dining','stays','experiences','social','wellness'];
  cats.forEach(c => {
    const pct = Math.round(siVals[c]);
    const amt = Math.round(budget * pct / 100);
    const el = document.getElementById('cat-budget-'+c);
    const pelEl = document.getElementById('cat-pct-'+c);
    if(el) el.textContent = '$'+amt.toLocaleString();
    if(pelEl) pelEl.textContent = pct+'% of budget';
  });

  state.navStack = ['categories'];
  updateBackBtn();
}

function updateBudgetDisplay() {
  const spent = state.itinerary.reduce((sum, item) => sum + (item.cost || 0), 0);
  const remaining = state.budget - spent;
  document.getElementById('disp-budget').textContent = '$'+Math.max(0, remaining).toLocaleString();
  document.getElementById('disp-spent').textContent = '$'+spent.toLocaleString();
  // Turn red if over budget
  const header = document.querySelector('.budget-header');
  if(remaining < 0) {
    header.style.background = 'linear-gradient(135deg,#c0392b,#922b21)';
  } else if(remaining < state.budget * 0.1) {
    header.style.background = 'linear-gradient(135deg,#d4a017,#b8860b)';
  } else {
    header.style.background = '';
    header.style.backgroundColor = 'var(--brand)';
  }
}

function toggleItinerary(event, name, catKey, subcatName, lat, lng, cost) {
  event.stopPropagation();
  const btn = document.getElementById('addbtn-'+name.replace(/\s/g,'_'));
  const existing = state.itinerary.findIndex(i=>i.name===name);

  if(existing > -1) {
    state.itinerary.splice(existing,1);
    if(btn){btn.textContent='+ Itinerary';btn.classList.remove('added');}
  } else {
    state.itinerary.push({name, catKey, subcatName, lat, lng, day:1, cost: cost||0});
    if(btn){btn.textContent='✓ Added';btn.classList.add('added');}
    const tabIt = document.getElementById('tab-itinerary');
    tabIt.style.transform='scale(1.1)';

  updateBudgetDisplay();
  renderItinerary();
}

function rsRebalance(moved) {
  const v = parseInt(document.getElementById('rs-sl-'+moved).value);
  const rem = 100-v, others = rsCats.filter(c=>c!==moved), ot = others.reduce((s,c)=>s+rsVals[c],0);
  rsVals[moved] = v;
  if(ot > 0) { others.forEach(c=>{rsVals[c]=Math.max(0,rsVals[c]*rem/ot);}); const diff=100-rsCats.reduce((s,c)=>s+rsVals[c],0); const adj=others.filter(c=>rsVals[c]>0); if(adj.length) rsVals[adj[0]]+=diff; }
  else { others.forEach(c=>{rsVals[c]=rem/others.length;}); }
  syncRS();
  siVals = {...rsVals};
  updateBudgetDisplay();
}

// ── DISTANCE ───────────────────────────────────────────────────────────────
function distMiles(lat1, lng1, lat2, lng2) {
  const R=3959, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function centerOnMe() {
  if(!state.userLat || !state.map) { showToast('Enable location to use Near Me'); return; }
  state.map.setView([state.userLat, state.userLng], 15);
  L.marker([state.userLat, state.userLng], {icon: L.divIcon({html:'<div style="width:14px;height:14px;background:#2C5F8C;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(state.map).bindPopup('You are here').openPopup();
}

  else { state.favorites.push(name); if(btn){btn.classList.add('loved');btn.textContent='♥';} showToast('♥ Saved to favorites'); }
  saveState();
}

  if(cat==='dining') return 'https://www.opentable.com/s?term='+n;
  if(cat==='stays') return 'https://www.booking.com/searchresults.html?ss='+n+'+'+c;

  return 'https://www.yelp.com/search?find_desc='+n+'&find_loc='+c;
}

        <div style="display:flex;align-items:flex-start;gap:0.6rem;">

          <div>
            <div class="place-name">${place.name}</div>
            <div class="place-rating">★ ${place.rating}${distStr ? ' &nbsp;·&nbsp; <span class="dist-tag">📍 '+distStr+'</span>' : ''}</div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-size:0.85rem;font-weight:500;color:${color}">${place.price}</div>
          ${place.budget > 0 ? `<div style="font-size:0.7rem;color:var(--ink-light);">~$${place.budget}</div>` : '<div style="font-size:0.7rem;color:var(--cat-wellness);">Free</div>'}
        </div>
      </div>
      <div class="place-desc">${place.desc}</div>
      <div class="place-footer">
        <div class="place-tags">${place.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:0.4rem;flex-shrink:0;">
          <button class="fav-btn ${inFav?'loved':''}" id="fav-${place.name.replace(/\W/g,'_')}" onclick="toggleFav(event,'${place.name}')">${inFav?'♥':'♡'}</button>
          <a class="book-btn" href="${bUrl}" target="_blank">Book ↗</a>
          <button class="add-btn ${inIt?'added':''}" id="addbtn-${place.name.replace(/\s/g,'_')}" onclick="toggleItinerary(event,'${place.name}','${catKey}','${subcatName}',${place.lat},${place.lng},${place.budget||0})">${inIt?'✓ Added':'+ Itinerary'}</button>
        </div>

  });

}

// ── SEARCH ─────────────────────────────────────────────────────────────────
function doSearch(q) {
  const el = document.getElementById('srch-results');
  if(!q || q.length < 2) { el.innerHTML = '<div class="srch-empty"><div style="font-size:2rem;opacity:0.3;margin-bottom:0.5rem;">🔍</div><div style="font-size:0.88rem;">Search restaurants, bars, hotels and more</div></div>'; return; }
  const results = []; const lq = q.toLowerCase();
  const cd = DATA[state.city]; if(!cd) return;
  const catNames = {dining:'Dining',stays:'Stays',experiences:'Experiences',social:'Social',wellness:'Wellness'};
  const catColors = {dining:'#E07A5F',stays:'#2C5F8C',experiences:'#6B7A8D',social:'#C8A96A',wellness:'#81B29A'};
  Object.entries(cd).forEach(([cat, catData]) => {
    Object.entries(catData).forEach(([sub, subData]) => {
      subData.places.forEach(p => {
        if(p.name.toLowerCase().includes(lq) || p.desc.toLowerCase().includes(lq) || p.tags.some(t=>t.toLowerCase().includes(lq)) || sub.toLowerCase().includes(lq)) {
          results.push({...p, cat, sub});
        }
      });
    });
  });
  if(!results.length) { el.innerHTML = '<div class="srch-empty"><div style="font-size:1.5rem;opacity:0.4;margin-bottom:0.5rem;">😕</div><div>No results for "'+q+'"</div></div>'; return; }
  el.innerHTML = '<div style="font-size:0.75rem;color:var(--ink-light);margin-bottom:0.65rem;">'+results.length+' result'+(results.length!==1?'s':'')+'</div>';
  results.forEach(p => {
    const inIt = state.itinerary.some(x=>x.name===p.name);
    const bUrl = bookingUrl(p, p.cat);
    const item = document.createElement('div'); item.className = 'srch-result';
    item.innerHTML = `<div class="srch-result-top"><div class="srch-name">${p.name}</div><span class="srch-pill" style="background:${catColors[p.cat]}">${catNames[p.cat]}</span></div><div class="srch-meta">★ ${p.rating} · ${p.price}${p.budget>0?' · ~$'+p.budget:' · Free'} · ${p.sub}</div><div class="srch-desc">${p.desc}</div><div style="display:flex;gap:0.4rem;margin-top:0.6rem;"><a class="book-btn" href="${bUrl}" target="_blank">Book ↗</a><button class="add-btn ${inIt?'added':''}" id="sadd-${p.name.replace(/\W/g,'_')}" onclick="toggleItinerary(event,'${p.name}','${p.cat}','${p.sub}',${p.lat||0},${p.lng||0},${p.budget||0})">${inIt?'✓ Added':'+ Itinerary'}</button></div>`;
    el.appendChild(item);
  });
}

// ── SURPRISE ME ────────────────────────────────────────────────────────────
function surpriseMe() {
  const tod = getTOD();
  const todCats = {morning:['dining','wellness'],afternoon:['experiences','dining'],evening:['dining','social'],night:['social','dining']};
  const cats = todCats[tod] || ['dining','experiences'];
  const cd = DATA[state.city]; if(!cd) return;
  const catColors = {dining:'#E07A5F',stays:'#2C5F8C',experiences:'#6B7A8D',social:'#C8A96A',wellness:'#81B29A'};
  const catNames = {dining:'Dining',stays:'Stays',experiences:'Experiences',social:'Social',wellness:'Wellness'};
  const catEmoji = {dining:'🍽',stays:'🏨',experiences:'🎭',social:'🥂',wellness:'🧘'};
  let best = null, bestRating = 0;
  cats.forEach(cat => {
    if(!cd[cat]) return;
    Object.entries(cd[cat]).forEach(([sub, data]) => {
      data.places.forEach(p => { if(p.rating > bestRating) { bestRating = p.rating; best = {...p, cat, sub}; } });
    });
  });
  if(!best) return;
  const inIt = state.itinerary.some(x=>x.name===best.name);
  const bUrl = bookingUrl(best, best.cat);
  document.getElementById('surp-content').innerHTML = `<div class="surp-badge">${catEmoji[best.cat]} ${catNames[best.cat]} · ${best.sub}</div><div class="surp-name">${best.name}</div><div class="surp-rating">★ ${best.rating} · ${best.price}${best.budget>0?' · ~$'+best.budget:' · Free'}</div><div class="surp-desc">${best.desc}</div><div class="surp-acts"><a class="surp-book" href="${bUrl}" target="_blank">Book Now ↗</a><button class="surp-add ${inIt?'added':''}" id="surp-add-btn" onclick="surpAdd('${best.name}','${best.cat}','${best.sub}',${best.lat||0},${best.lng||0},${best.budget||0})">${inIt?'✓ Added':'+ Add to Itinerary'}</button></div>`;
  document.getElementById('surp-overlay').classList.add('open');
}
function surpAdd(name, cat, sub, lat, lng, cost) {
  const inIt = state.itinerary.some(x=>x.name===name);
  if(!inIt) { state.itinerary.push({name,cat,sub,lat,lng,cost,day:1}); updateBudgetDisplay(); renderItinerary(); saveState(); showToast('✓ Added to itinerary'); const btn=document.getElementById('surp-add-btn'); if(btn){btn.textContent='✓ Added';btn.classList.add('added');} }
}
function closeSurprise(e) {
  if(!e || e.target === document.getElementById('surp-overlay')) document.getElementById('surp-overlay').classList.remove('open');
}

// ── SHARE & EXPORT ─────────────────────────────────────────────────────────
function sharePlan() {
  const data = { city: state.city, budget: state.budget, itinerary: state.itinerary };
  const encoded = btoa(JSON.stringify(data));
  const url = window.location.href.split('#')[0] + '#shared=' + encoded;
  if(navigator.share) { navigator.share({ title:'My Sojourn Plan', url }); }
  else { navigator.clipboard.writeText(url).then(() => showToast('🔗 Link copied!')).catch(() => showToast('Copy this URL: '+url.substring(0,40)+'...')); }
}
function exportPDF() { showToast('📄 Opening print view...'); setTimeout(() => window.print(), 400); }

// ── ENHANCED ITINERARY RENDER ──────────────────────────────────────────────
function updateBudgetSummary() {
  const spent = state.itinerary.reduce((s,i)=>s+(i.cost||0),0);
  const bsEl = document.getElementById('bsummary');
  if(bsEl) {
    document.getElementById('bs-total').textContent = '$'+state.budget.toLocaleString();
    document.getElementById('bs-spent').textContent = '$'+spent.toLocaleString();
    document.getElementById('bs-left').textContent = '$'+Math.max(0,state.budget-spent).toLocaleString();
  }
}

// ── LOAD SAVED STATE ON START ──────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = loadState();
  if(saved && saved.city) {
    state.city = saved.city;
    state.budget = saved.budget || 1500;
    state.itinerary = saved.itinerary || [];
    state.favorites = saved.favorites || [];
    if(saved.sliders) { siVals = {...saved.sliders}; rsVals = {...saved.sliders}; }
    document.getElementById('city-input').value = state.city;
    document.getElementById('budget-input').value = state.budget;
    Object.keys(siVals).forEach(c => {
      const s = document.getElementById('si-sl-'+c); if(s) s.value = siVals[c];
    });
    siRender();
    buildPlan();
    updateBudgetSummary();
    showToast('Welcome back to '+state.city.split(',')[0]+'!');
    return;
  }
  syncRS();
  renderTimeBanner();
});
